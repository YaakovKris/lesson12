# dbt на Spark через method: session — працює проти локальної SparkSession в одному
# процесі, без thrift-сервера. Читає/пише той самий spark-warehouse, що й bronze_job.py.
github_lakehouse:
  target: dev
  outputs:
    dev:
      type: spark
      method: session
      schema: default
      host: localhost
      server_side_parameters:
        spark.sql.warehouse.dir: "spark-warehouse"
        spark.sql.catalogImplementation: "hive"
        spark.hadoop.javax.jdo.option.ConnectionURL: "jdbc:derby:metastore_db;create=true"
        spark.hadoop.javax.jdo.option.ConnectionDriverName: "org.apache.derby.jdbc.EmbeddedDriver"
        spark.hadoop.javax.jdo.option.ConnectionUserName: "APP"
        spark.hadoop.javax.jdo.option.ConnectionPassword: "mine"
        spark.hadoop.datanucleus.autoCreateSchema: "true"
        spark.hadoop.datanucleus.fixedDatastore: "true"
        spark.hadoop.datanucleus.schema.autoCreateAll: "true"
